# HTTP. Health checks and the OpenAPI document are served at the root, not under /q.
quarkus.http.port=8080
quarkus.http.non-application-root-path=/
# A record is 315 characters; this leaves room for the JSON form of an object.
quarkus.http.limits.max-body-size=64K

# Logging. The request ID comes from RequestIdFilter.
quarkus.log.level=INFO
quarkus.log.category."io.github.allanhladki".level=INFO
%dev.quarkus.log.category."io.github.allanhladki".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5p (%c{2.}): %s%e%n

# OpenAPI document and Swagger UI. The UI is also included in the packaged application.
quarkus.smallrye-openapi.path=/swagger
quarkus.smallrye-openapi.info-title=flat2java Quarkus demo
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Reads and writes fixed-width records with flat2java. Each endpoint has named examples in its request body: pick one in the Examples list, then press Execute.
quarkus.smallrye-openapi.info-license-name=MIT License
quarkus.smallrye-openapi.info-license-url=https://opensource.org/licenses/MIT
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=swagger-ui
quarkus.swagger-ui.try-it-out-enabled=true
quarkus.swagger-ui.doc-expansion=list
quarkus.swagger-ui.display-request-duration=true

# flat2java options (flat2java-quarkus). Only fail-on-string-truncation differs from the defaults:
# a text longer than its column is an error instead of being cut, so no data is lost silently.
flat2java.allow-null-strings=true
flat2java.fail-on-string-truncation=true
flat2java.decimal.use-separator=false
flat2java.decimal.separator=.
flat2java.decimal.rounding-mode=unnecessary
