# Server configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# LOGs
quarkus.log.level=INFO
quarkus.log.category."com.github.allanhladki".min-level=TRACE
quarkus.log.category."com.github.allanhladki".level=TRACE
quarkus.log.console.level=TRACE
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5p (%c{2.}): %s%e%n
quarkus.log.console.color=true

# Swagger UI configuration
quarkus.smallrye-openapi.path=/swagger
quarkus.http.non-application-root-path=/
