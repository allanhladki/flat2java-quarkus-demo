# Test Configuration
quarkus.test.flat-classpath=true
quarkus.test.inject.bean=false

# Logging for tests
quarkus.log.level=INFO
quarkus.log.category."com.github.allanhladki.flat2java.quarkus.demo".level=DEBUG

# Test-specific settings
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# Disable metrics for tests
quarkus.smallrye-metrics.enabled=false

# Test timeout
quarkus.test.timeout=30s
